[project]
name = "diabetes-risk-agent"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-p", "no:anyio"]
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "evals/reports"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "C4", "PIE", "PT", "RET"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["config", "evals", "memory", "pipeline", "routes", "schemas", "main", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"**/tests/conftest.py" = ["E402"]
"**/evals/__main__.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["."]
explicit_package_bases = true
exclude = ["^\\.venv/", "^evals/reports/"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
